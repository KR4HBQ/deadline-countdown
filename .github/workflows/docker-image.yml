# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io)
# on every push to main, and for version tags like v1.2.0.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't need a new image
    paths-ignore: ['**.md', '**.txt', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '**.txt', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is lowercased automatically (ghcr.io/kr4hbq/deadline-countdown).
      # Tags: "latest" for main, "1.2.0" / "1.2" for a v1.2.0 tag, plus the short commit id.
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Deadline Countdown
            org.opencontainers.image.description=Countdown in calendar and business days, skipping weekends and company holidays

      # Pull requests only check that the image builds; they don't publish it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
